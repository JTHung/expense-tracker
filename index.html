<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>帳簿 · 記帳本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3EAD6;
    --paper-line:#DCCFAE;
    --ink:#2B2620;
    --ink-soft:#5C5548;
    --ink-faint:#8C8471;
    --seal:#A6303C;
    --seal-dark:#7C1F29;
    --brass:#A67C3D;
    --green:#4F6B4A;
    --card:#FBF6EA;
    --border:#D8C9A3;
    --danger:#9E3B3B;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    background-image:
      repeating-linear-gradient(90deg, transparent 0 39px, rgba(166,48,60,0.06) 39px 40px),
      repeating-linear-gradient(0deg, transparent 0 27px, rgba(43,38,32,0.035) 27px 28px);
    color:var(--ink);
    font-family:'Noto Sans TC', sans-serif;
    line-height:1.6;
    min-height:100vh;
    padding:24px 16px 60px;
  }
  .wrap{max-width:760px;margin:0 auto;}

  /* header */
  .ledger-header{
    display:flex;justify-content:space-between;align-items:flex-end;
    border-bottom:3px double var(--ink);
    padding-bottom:14px;margin-bottom:22px;flex-wrap:wrap;gap:12px;
  }
  .ledger-title{
    font-family:'Noto Serif TC', serif;font-weight:700;
    font-size:28px;letter-spacing:4px;margin:0;
  }
  .ledger-sub{font-size:13px;color:var(--ink-soft);margin-top:4px;letter-spacing:1px;}
  .month-nav{display:flex;align-items:center;gap:10px;}
  .month-nav button{
    background:none;border:1px solid var(--ink);color:var(--ink);
    width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:15px;
    display:flex;align-items:center;justify-content:center;
  }
  .month-nav button:hover{background:var(--ink);color:var(--paper);}
  .month-label{font-family:'Noto Serif TC',serif;font-size:17px;font-weight:500;min-width:110px;text-align:center;}

  /* seal / summary */
  .summary-row{display:flex;gap:16px;margin-bottom:24px;flex-wrap:wrap;align-items:stretch;}
  .seal{
    flex:0 0 auto;width:118px;height:118px;border-radius:50%;
    border:3px solid var(--seal);color:var(--seal);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    transform:rotate(-6deg);position:relative;background:rgba(166,48,60,0.03);
  }
  .seal::before{
    content:'';position:absolute;inset:6px;border:1px solid var(--seal);border-radius:50%;opacity:0.5;
  }
  .seal .seal-label{font-family:'Noto Serif TC',serif;font-size:13px;letter-spacing:2px;font-weight:700;}
  .seal .seal-amt{font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:700;margin-top:2px;}

  .stat-cards{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;}
  .stat-card{
    background:var(--card);border:1px solid var(--border);border-radius:6px;
    padding:10px 12px;
  }
  .stat-card .label{font-size:12px;color:var(--ink-faint);letter-spacing:1px;}
  .stat-card .value{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;margin-top:2px;}

  /* category breakdown */
  .cat-breakdown{
    background:var(--card);border:1px solid var(--border);border-radius:6px;
    padding:14px 16px;margin-bottom:24px;
  }
  .cat-breakdown h3{
    font-family:'Noto Serif TC',serif;font-size:15px;margin:0 0 12px;
    border-bottom:1px solid var(--border);padding-bottom:8px;
  }
  .cat-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:13px;}
  .cat-row .cat-name{width:64px;flex:0 0 auto;color:var(--ink-soft);}
  .cat-row .bar-bg{flex:1;height:8px;background:var(--paper-line);border-radius:4px;overflow:hidden;}
  .cat-row .bar-fill{height:100%;background:var(--brass);border-radius:4px;}
  .cat-row .cat-amt{font-family:'JetBrains Mono',monospace;width:76px;text-align:right;flex:0 0 auto;}
  .empty-hint{color:var(--ink-faint);font-size:13px;text-align:center;padding:8px 0;}

  /* add entry form */
  .add-form{
    background:var(--card);border:1px solid var(--border);border-radius:6px;
    padding:16px;margin-bottom:28px;
  }
  .add-form h3{font-family:'Noto Serif TC',serif;font-size:15px;margin:0 0 12px;}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;}
  .form-grid label{font-size:12px;color:var(--ink-soft);display:block;margin-bottom:4px;}
  .form-grid input, .form-grid select{
    width:100%;padding:8px 9px;border:1px solid var(--border);border-radius:5px;
    background:#fff;font-family:'Noto Sans TC',sans-serif;font-size:14px;color:var(--ink);
    height:38px;box-sizing:border-box;-webkit-appearance:none;appearance:none;line-height:1.2;
  }
  .form-grid input[type="date"]{
    -webkit-appearance:none;appearance:none;
  }
  .form-grid .note-field{grid-column:1/-1;}
  .add-btn{
    margin-top:12px;width:100%;padding:10px;border:none;border-radius:5px;
    background:var(--seal);color:#fdf6ea;font-weight:700;font-size:14px;cursor:pointer;
    letter-spacing:2px;font-family:'Noto Serif TC',serif;
  }
  .add-btn:hover{background:var(--seal-dark);}

  /* daily list */
  .day-group{margin-bottom:18px;}
  .day-head{
    display:flex;justify-content:space-between;align-items:baseline;
    border-bottom:1px solid var(--ink);padding-bottom:4px;margin-bottom:6px;
  }
  .day-head .day-date{font-family:'Noto Serif TC',serif;font-weight:700;font-size:14px;}
  .day-head .day-total{font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--seal);font-weight:700;}
  .entry{
    display:flex;align-items:center;gap:10px;padding:7px 4px;border-bottom:1px dashed var(--paper-line);
    font-size:13.5px;
  }
  .entry .tag{
    flex:0 0 auto;font-size:11px;padding:2px 8px;border-radius:10px;
    background:rgba(166,48,60,0.1);color:var(--seal-dark);white-space:nowrap;
  }
  .entry .tag.method{
    background:rgba(166,124,61,0.14);color:var(--brass);
  }
  .entry .note{flex:1;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .entry .amt{font-family:'JetBrains Mono',monospace;font-weight:500;flex:0 0 auto;}
  .entry .del{
    flex:0 0 auto;background:none;border:none;color:var(--ink-faint);cursor:pointer;font-size:15px;padding:0 2px;
  }
  .entry .del:hover{color:var(--danger);}

  .loading{text-align:center;color:var(--ink-faint);padding:30px 0;font-size:13px;}

  .config-bar{
    background:var(--card);border:1px solid var(--border);border-radius:6px;
    padding:10px 14px;margin-bottom:18px;font-size:12px;
  }
  .config-bar label{color:var(--ink-soft);letter-spacing:1px;}
  .config-row{display:flex;gap:8px;margin-top:6px;}
  .config-row input{
    flex:1;padding:7px 9px;border:1px solid var(--border);border-radius:5px;
    font-size:12px;font-family:'JetBrains Mono',monospace;background:#fff;color:var(--ink);
  }
  .config-row button{
    padding:0 14px;border:1px solid var(--ink);border-radius:5px;background:none;
    color:var(--ink);cursor:pointer;font-size:12px;
  }
  .config-row button:hover{background:var(--ink);color:var(--paper);}
  .config-hint{margin-top:6px;color:var(--ink-faint);}
  .config-hint.err{color:var(--danger);}
  .config-hint.ok{color:var(--green);}
</style>
</head>
<body>
<div class="wrap">

  <div class="config-bar" id="configBar">
    <label>資料來源（Google Sheet API 網址，已預設好，如需更換其他表單才需要改）</label>
    <div class="config-row">
      <input type="text" id="apiUrlInput" placeholder="貼上 Apps Script 部署後的網址（.../exec）">
      <button id="saveApiUrl">儲存</button>
    </div>
    <div class="config-hint" id="configHint"></div>
  </div>

  <div class="ledger-header">
    <div>
      <h1 class="ledger-title">帳　簿</h1>
      <div class="ledger-sub">每日花費 · 月結明細</div>
    </div>
    <div class="month-nav">
      <button id="prevMonth" aria-label="上個月">‹</button>
      <div class="month-label" id="monthLabel">—</div>
      <button id="nextMonth" aria-label="下個月">›</button>
    </div>
  </div>

  <div class="summary-row">
    <div class="seal">
      <div class="seal-label">本月支出</div>
      <div class="seal-amt" id="sealTotal">$0</div>
    </div>
    <div class="stat-cards">
      <div class="stat-card"><div class="label">日均花費</div><div class="value" id="statAvg">$0</div></div>
      <div class="stat-card"><div class="label">筆數</div><div class="value" id="statCount">0</div></div>
      <div class="stat-card"><div class="label">最高單日</div><div class="value" id="statMaxDay">—</div></div>
    </div>
  </div>

  <div class="cat-breakdown">
    <h3>分類統計</h3>
    <div id="catBreakdownBody"><div class="empty-hint">本月尚無資料</div></div>
  </div>

  <div class="add-form">
    <h3>新增一筆</h3>
    <div class="form-grid">
      <div>
        <label>日期</label>
        <input type="date" id="inDate">
      </div>
      <div>
        <label>分類</label>
        <select id="inCategory">
          <option value="餐飲">餐飲</option>
          <option value="交通">交通</option>
          <option value="購物">購物</option>
          <option value="娛樂">娛樂</option>
          <option value="居住">居住</option>
          <option value="醫療">醫療</option>
          <option value="其他">其他</option>
        </select>
      </div>
      <div>
        <label>金額</label>
        <input type="number" id="inAmount" placeholder="0" min="0" step="1">
      </div>
      <div>
        <label>類別</label>
        <select id="inMethod">
          <option value="現金">現金</option>
          <option value="LINE Pay">LINE Pay</option>
        </select>
      </div>
      <div>
        <label>記帳人</label>
        <input type="text" id="inWho" placeholder="你的名字">
      </div>
      <div class="note-field">
        <label>備註</label>
        <input type="text" id="inNote" placeholder="例如：午餐、捷運卡儲值">
      </div>
    </div>
    <button class="add-btn" id="addBtn">記　一　筆</button>
  </div>

  <div id="dailyList"><div class="loading">載入中…</div></div>

</div>

<script>
(function(){
  var entries = [];
  var current = new Date();
  current.setDate(1);

  var monthLabel = document.getElementById('monthLabel');
  var dailyList = document.getElementById('dailyList');
  var sealTotal = document.getElementById('sealTotal');
  var statAvg = document.getElementById('statAvg');
  var statCount = document.getElementById('statCount');
  var statMaxDay = document.getElementById('statMaxDay');
  var catBody = document.getElementById('catBreakdownBody');

  function fmt(n){ return '$' + Math.round(n).toLocaleString('zh-TW'); }
  function pad(n){ return n < 10 ? '0' + n : '' + n; }
  function ymd(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }

  document.getElementById('inDate').value = ymd(new Date());

  var apiUrlInput = document.getElementById('apiUrlInput');
  var configHint = document.getElementById('configHint');
  var DEFAULT_API_URL = 'https://script.google.com/macros/s/AKfycbwf0st3p_uI34uAwTlZ23aMZPGVr6K_iewf7GjcK0OO6La_QcZjQogTd23-oSG0GxT1/exec';
  var API_URL = localStorage.getItem('sheetApiUrl') || DEFAULT_API_URL;
  apiUrlInput.value = API_URL;

  function setHint(msg, cls){
    configHint.textContent = msg;
    configHint.className = 'config-hint' + (cls ? ' ' + cls : '');
  }

  document.getElementById('saveApiUrl').addEventListener('click', function(){
    API_URL = apiUrlInput.value.trim();
    localStorage.setItem('sheetApiUrl', API_URL);
    setHint('測試連線中…', '');
    load();
  });

  async function load(){
    if(!API_URL){
      setHint('尚未設定 Google Sheet 網址，請先部署 Apps Script 並貼上網址。', 'err');
      entries = [];
      render();
      return;
    }
    dailyList.innerHTML = '<div class="loading">從 Google Sheet 讀取中…</div>';
    try{
      var res = await fetch(API_URL);
      var text = await res.text();
      var data;
      try{
        data = JSON.parse(text);
      }catch(parseErr){
        console.error('回應不是 JSON，內容開頭：', text.slice(0,200));
        throw new Error('回應格式不是 JSON，可能是 Google 要求登入授權頁面，請確認部署設定為「誰可以存取：所有人」。');
      }
      entries = data.map(function(r){
        var d = r.date;
        if(d && typeof d === 'string' && d.indexOf('T') > -1) d = d.slice(0,10);
        return {
          id: String(r.id),
          date: d,
          category: r.category,
          method: r.method,
          who: r.who,
          amount: Number(r.amount),
          note: r.note
        };
      });
      setHint('已連線，共 ' + entries.length + ' 筆資料。', 'ok');
    }catch(e){
      console.error('讀取失敗：', e);
      entries = [];
      setHint('讀取失敗：' + e.message, 'err');
    }
    render();
  }

  async function apiPost(payload){
    try{
      await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      return true;
    }catch(e){
      setHint('寫入失敗，請檢查網路連線或 Apps Script 網址。', 'err');
      return false;
    }
  }

  function monthKey(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1); }

  function render(){
    var mk = monthKey(current);
    monthLabel.textContent = current.getFullYear() + ' 年 ' + (current.getMonth()+1) + ' 月';

    var monthEntries = entries.filter(function(e){ return e.date.slice(0,7) === mk; });

    // daily grouping
    var byDay = {};
    monthEntries.forEach(function(e){
      if(!byDay[e.date]) byDay[e.date] = [];
      byDay[e.date].push(e);
    });
    var days = Object.keys(byDay).sort().reverse();

    if(days.length === 0){
      dailyList.innerHTML = '<div class="empty-hint">本月尚無記錄，開始記下第一筆吧。</div>';
    } else {
      var html = '';
      days.forEach(function(day){
        var list = byDay[day];
        var dayTotal = list.reduce(function(s,e){ return s + e.amount; }, 0);
        var weekday = ['日','一','二','三','四','五','六'][new Date(day+'T00:00:00').getDay()];
        html += '<div class="day-group">';
        html += '<div class="day-head"><span class="day-date">' + day + '（週' + weekday + '）</span><span class="day-total">' + fmt(dayTotal) + '</span></div>';
        list.forEach(function(e){
          html += '<div class="entry">';
          html += '<span class="tag">' + e.category + '</span>';
          html += '<span class="tag method">' + (e.method || '現金') + '</span>';
          html += '<span class="note">' + (e.who ? e.who + ' · ' : '') + (e.note ? e.note : '') + '</span>';
          html += '<span class="amt">' + fmt(e.amount) + '</span>';
          html += '<button class="del" data-id="' + e.id + '" aria-label="刪除">✕</button>';
          html += '</div>';
        });
        html += '</div>';
      });
      dailyList.innerHTML = html;
      dailyList.querySelectorAll('.del').forEach(function(btn){
        btn.addEventListener('click', async function(){
          btn.disabled = true;
          var ok = await apiPost({ action: 'delete', id: btn.dataset.id });
          if(ok) await load(); else render();
        });
      });
    }

    // summary
    var total = monthEntries.reduce(function(s,e){ return s + e.amount; }, 0);
    var dayCount = Object.keys(byDay).length;
    sealTotal.textContent = fmt(total);
    statAvg.textContent = dayCount ? fmt(total / dayCount) : '$0';
    statCount.textContent = monthEntries.length;

    var maxDay = null, maxVal = -1;
    Object.keys(byDay).forEach(function(d){
      var v = byDay[d].reduce(function(s,e){ return s + e.amount; }, 0);
      if(v > maxVal){ maxVal = v; maxDay = d; }
    });
    statMaxDay.textContent = maxDay ? (maxDay.slice(5) + '（' + fmt(maxVal) + '）') : '—';

    // category breakdown
    var byCat = {};
    monthEntries.forEach(function(e){
      byCat[e.category] = (byCat[e.category]||0) + e.amount;
    });
    var cats = Object.keys(byCat).sort(function(a,b){ return byCat[b]-byCat[a]; });
    if(cats.length === 0){
      catBody.innerHTML = '<div class="empty-hint">本月尚無資料</div>';
    } else {
      var maxCat = byCat[cats[0]];
      var chtml = '';
      cats.forEach(function(c){
        var pct = maxCat ? (byCat[c]/maxCat*100) : 0;
        chtml += '<div class="cat-row">';
        chtml += '<span class="cat-name">' + c + '</span>';
        chtml += '<span class="bar-bg"><span class="bar-fill" style="width:' + pct + '%"></span></span>';
        chtml += '<span class="cat-amt">' + fmt(byCat[c]) + '</span>';
        chtml += '</div>';
      });
      catBody.innerHTML = chtml;
    }
  }

  document.getElementById('addBtn').addEventListener('click', async function(){
    var date = document.getElementById('inDate').value;
    var category = document.getElementById('inCategory').value;
    var amount = parseFloat(document.getElementById('inAmount').value);
    var method = document.getElementById('inMethod').value;
    var who = document.getElementById('inWho').value.trim();
    var note = document.getElementById('inNote').value.trim();

    if(!API_URL){
      alert('請先在上方貼上 Google Sheet 的 Apps Script 網址');
      return;
    }
    if(!date || !amount || amount <= 0){
      alert('請輸入日期與有效金額');
      return;
    }

    var entry = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
      date: date,
      category: category,
      method: method,
      who: who,
      amount: amount,
      note: note
    };

    var addBtn = this;
    addBtn.disabled = true;
    var ok = await apiPost(Object.assign({ action: 'add' }, entry));
    addBtn.disabled = false;

    if(ok){
      document.getElementById('inAmount').value = '';
      document.getElementById('inNote').value = '';
      current = new Date(date);
      current.setDate(1);
      await load();
    }
  });

  document.getElementById('prevMonth').addEventListener('click', function(){
    current.setMonth(current.getMonth()-1);
    render();
  });
  document.getElementById('nextMonth').addEventListener('click', function(){
    current.setMonth(current.getMonth()+1);
    render();
  });

  load();
})();
</script>
</body>
</html>
